<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('修改配置密码')}"></head>
<body>
<div th:replace="~{fragments/page :: nav}"></div>
<div class="narrow">
    <div class="card">
        <h1>修改配置密码</h1>
        <p class="sub">
            改密会用新密码重新派生密钥，并把整个配置文件（全部连接 + 新密码派生的信封）重写信回
            <code>config.data</code>。改完之后旧密码立即失效，也没有找回途径。
        </p>
        <form method="post" th:action="@{/admin/password}">
            <label for="current">当前配置密码</label>
            <input type="password" id="current" name="current" autocomplete="current-password" autofocus required>
            <label for="next">新配置密码</label>
            <input type="password" id="next" name="next" autocomplete="new-password" minlength="8" required>
            <label for="confirm">再输入一次新密码</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
            <div th:replace="~{fragments/page :: flash}"></div>
            <button type="submit">修改并重写配置文件</button>
        </form>
    </div>
</div>
</body>
</html>
